version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: hireflow-postgres
    restart: always
    environment:
      POSTGRES_USER: hireflow
      POSTGRES_PASSWORD: hireflow_secret_password
      POSTGRES_DB: hireflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireflow -d hireflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hireflow-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hireflow-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://hireflow:hireflow_secret_password@postgres:5432/hireflow_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: hireflow-production-jwt-secret-key-2026
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-1.5-flash
      STORAGE_TYPE: local
      LOCAL_STORAGE_DIR: /app/storage/cvs
      N8N_BASE_URL: http://n8n:5678
      N8N_WEBHOOK_SECRET: hireflow-n8n-webhook-secret
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hireflow-celery-worker
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info
    restart: always
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://hireflow:hireflow_secret_password@postgres:5432/hireflow_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: hireflow-production-jwt-secret-key-2026
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-1.5-flash
      STORAGE_TYPE: local
      LOCAL_STORAGE_DIR: /app/storage/cvs
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hireflow-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

  n8n:
    image: n8nio/n8n:latest
    container_name: hireflow-n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=hireflow_n8n_pass
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data:

